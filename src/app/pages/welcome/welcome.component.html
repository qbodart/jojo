<div class="min-h-screen bg-gradient-to-br from-pink-100 via-purple-50 to-sky-100 flex flex-col items-center justify-center p-4 sm:p-8">

  <!-- Title -->
  <div class="text-center mb-8 sm:mb-12 animate-bounce-in">
    <h1 class="text-4xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-sky-500 mb-4">
      Reken Kampioen
    </h1>
    <p class="text-xl sm:text-2xl text-purple-600 font-semibold">
      Hallo! Wat is jouw naam?
    </p>
  </div>

  <!-- Name Input -->
  <div class="w-full max-w-sm mb-8 animate-bounce-in">
    <form (ngSubmit)="submit()" class="flex flex-col items-center gap-4">
      <input
        type="text"
        [value]="nameInput()"
        (input)="nameInput.set($any($event.target).value)"
        placeholder="Jouw naam..."
        class="w-full text-center text-2xl sm:text-3xl font-bold py-4 px-6 rounded-2xl border-3 border-purple-300 focus:border-purple-500 focus:outline-none focus:ring-4 focus:ring-purple-200 shadow-lg bg-white text-purple-800 placeholder-purple-300"
        autocomplete="given-name"
        autofocus
      />
      <button
        type="submit"
        [disabled]="!canSubmit()"
        [class]="'px-10 sm:px-16 py-4 sm:py-5 rounded-full text-xl sm:text-2xl font-extrabold shadow-xl transition-all duration-300 cursor-pointer ' +
          (canSubmit()
            ? 'bg-gradient-to-r from-amber-400 to-orange-500 text-white hover:from-amber-500 hover:to-orange-600 hover:scale-110 hover:shadow-2xl active:scale-95'
            : 'bg-gray-300 text-gray-500 cursor-not-allowed')"
      >
        Laten we beginnen!
      </button>
    </form>
  </div>
</div>
